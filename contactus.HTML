<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us - Birds High School</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* CM001 - Body Styles */
body { font-family: 'Roboto Slab', serif; background-color: #f3f4f6; background-image: linear-gradient(135deg, #e0e7ff 0%, #f3f4f6 100%); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }

/* CM002 - Icons and Hover Effects */
.icon-box { transition: all 0.3s ease; }
.icon-box:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }

/* CM003 - Buttons HD Style */
.btn-hd { transition: all 0.3s ease; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); border: 2px solid transparent; }
.btn-hd:hover { transform: translateY(-3px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); }

/* CM004 - Header Section CSS Comment */
/* Tailwind classes applied directly in HTML */

/* CM005 - Contact Information Grid CSS Comment */
/* Tailwind classes applied directly in HTML */

/* CM006 - Contact Details Left Side CSS Comment */
/* Tailwind classes applied directly in HTML */

/* CM007 - Form Section Right Side CSS Comment */
/* Tailwind classes applied directly in HTML */

/* CM008 - Location Section CSS Comment */
/* Tailwind classes applied directly in HTML */
</style>
</head>
<body class="min-h-screen py-4 px-4 sm:px-6 max-w-4xl mx-auto">

<!-- CM009 - Header Section -->
<div class="text-center mb-4">
<h2 class="text-xl font-bold text-gray-900 uppercase tracking-wide">Contact Us</h2>
<p class="text-gray-700 mt-1 text-sm font-medium">We would love to hear from you. Get in touch with us!</p>
</div>

<!-- CM010 - Contact Information Grid Container -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">

<!-- CM011 - Contact Details Left Side -->
<div class="flex flex-col justify-center space-y-3">
<div class="flex items-start icon-box bg-white p-3 rounded-lg shadow-sm">
<div class="flex-shrink-0 bg-blue-100 text-blue-700 p-2 rounded-full flex items-center justify-center h-9 w-9 text-sm"><i class="fas fa-phone-alt"></i></div>
<div class="ml-3">
<h3 class="text-sm font-bold text-gray-900">Phone</h3>
<p class="text-gray-700 font-medium text-xs mt-0.5">09182135594</p>
</div>
</div>
<div class="flex items-start icon-box bg-white p-3 rounded-lg shadow-sm">
<div class="flex-shrink-0 bg-red-100 text-red-600 p-2 rounded-full flex items-center justify-center h-9 w-9 text-sm"><i class="fas fa-envelope"></i></div>
<div class="ml-3">
<h3 class="text-sm font-bold text-gray-900">Email Address</h3>
<p class="text-gray-700 font-medium text-xs mt-0.5">contact.birdsschool@gmail.com</p>
</div>
</div>
<div class="flex items-start icon-box bg-white p-3 rounded-lg shadow-sm">
<div class="flex-shrink-0 bg-green-100 text-green-700 p-2 rounded-full flex items-center justify-center h-9 w-9 text-sm"><i class="fas fa-home"></i></div>
<div class="ml-3">
<h3 class="text-sm font-bold text-gray-900">Address</h3>
<p class="text-gray-700 font-medium text-xs mt-0.5 leading-relaxed">BIRDS SCHOOL,<br>3H4W+P8J, Mutyala Padu,<br>Andhra Pradesh 518553.</p>
</div>
</div>
<div class="pt-1">
<h3 class="text-sm font-bold text-gray-900 mb-2">Follow Us</h3>
<div class="flex space-x-2">
<a id="linkFacebook" href="#" class="h-8 w-8 bg-blue-600 text-white rounded-full flex items-center justify-center text-sm hover:bg-blue-700 transition shadow-sm transform hover:-translate-y-1"><i class="fab fa-facebook-f"></i></a>
<a id="linkInstagram" href="#" class="h-8 w-8 bg-pink-600 text-white rounded-full flex items-center justify-center text-sm hover:bg-pink-700 transition shadow-sm transform hover:-translate-y-1"><i class="fab fa-instagram"></i></a>
<a id="linkTwitter" href="#" class="h-8 w-8 bg-blue-400 text-white rounded-full flex items-center justify-center text-sm hover:bg-blue-500 transition shadow-sm transform hover:-translate-y-1"><i class="fab fa-twitter"></i></a>
<a id="linkYoutube" href="#" class="h-8 w-8 bg-red-600 text-white rounded-full flex items-center justify-center text-sm hover:bg-red-700 transition shadow-sm transform hover:-translate-y-1"><i class="fab fa-youtube"></i></a>
</div>
</div>
</div>

<!-- CM012 - Form Section Right Side -->
<div class="bg-white p-4 rounded-lg shadow-sm border border-gray-100 flex flex-col justify-center">
<h2 class="text-lg font-bold text-gray-900 mb-3">Send us a Message</h2>
<form id="contactForm" class="space-y-3">
<div><label class="block text-xs font-bold text-gray-800 mb-0.5">Full Name</label><input type="text" id="inputName" required placeholder="Enter your name" class="w-full px-2.5 py-1.5 rounded-md border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition bg-gray-50 focus:bg-white text-xs font-medium text-gray-900"></div>
<div><label class="block text-xs font-bold text-gray-800 mb-0.5">Email Address</label><input type="email" id="inputEmail" placeholder="Enter your email" class="w-full px-2.5 py-1.5 rounded-md border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition bg-gray-50 focus:bg-white text-xs font-medium text-gray-900"></div>
<div><label class="block text-xs font-bold text-gray-800 mb-0.5">Mobile Number</label><input type="tel" id="inputMobile" required placeholder="Enter your mobile number" class="w-full px-2.5 py-1.5 rounded-md border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition bg-gray-50 focus:bg-white text-xs font-medium text-gray-900"></div>
<div><label class="block text-xs font-bold text-gray-800 mb-0.5">Your Message</label><textarea id="inputMessage" rows="2" required placeholder="Write your message here..." class="w-full px-2.5 py-1.5 rounded-md border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition bg-gray-50 focus:bg-white resize-none text-xs font-medium text-gray-900"></textarea></div>
<button type="submit" id="btnSubmit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-3 rounded-md transition shadow-sm flex justify-center items-center gap-1.5 text-sm"><i class="fas fa-paper-plane"></i> Send Message</button>
</form>
</div>

</div>

<!-- CM013 - Location Section -->
<div class="bg-white p-4 rounded-lg shadow-sm border border-gray-100">
<h3 class="text-lg font-bold text-gray-900 mb-3 text-center">Our Location</h3>
<div class="w-full h-[200px] rounded-lg overflow-hidden shadow-sm border border-gray-200 relative bg-gray-100">
<iframe id="mapIframe" title="Birds High School Map Location" src="" class="absolute top-0 left-0 w-full h-full" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
</div>
<div class="flex flex-wrap justify-center gap-3 mt-4">
<a id="linkDirections" href="#" target="_blank" class="btn-hd flex items-center gap-1.5 px-4 py-1.5 bg-gradient-to-r from-blue-600 to-blue-700 text-white rounded-full font-bold text-sm"><i class="fas fa-directions text-base"></i> Direction</a>
<button id="btnShare" class="btn-hd flex items-center gap-1.5 px-4 py-1.5 bg-gradient-to-r from-green-500 to-green-600 text-white rounded-full font-bold text-sm"><i class="fas fa-share-alt text-base"></i> Share</button>
<button id="btnSave" class="btn-hd flex items-center gap-1.5 px-4 py-1.5 bg-gradient-to-r from-yellow-500 to-yellow-600 text-white rounded-full font-bold text-sm"><i class="far fa-bookmark text-base"></i> Save</button>
</div>
</div>

<script>
/* CM014 - Links and Configuration Constants */
const CONFIG_FACEBOOK = "#"; const CONFIG_INSTAGRAM = "#"; const CONFIG_TWITTER = "#"; const CONFIG_YOUTUBE = "#"; const CONFIG_DIRECTIONS = "https://www.google.com/maps/dir//Birds+School,+3H4W%2BP8J,+Mutyala+Padu,+Andhra+Pradesh+518553"; const CONFIG_MAP_SRC = "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d481.60531285707555!2d78.59523186952934!3d15.056825199999992!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bb46110dd6e131b%3A0xb7bfef22dfbd3b23!2sBirds%20School!5e0!3m2!1sen!2sin!4v1788807431775!5m2!1sen!2sin"; const CONFIG_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzlV9J4VwbiE86LlHU1n-PBQzS5j5OXr1qG8QmuMYGcjECMV0whvyS80KyupXpeZlrP9Q/exec";

/* CM015 - Element Assignments */
document.getElementById('linkFacebook').href = CONFIG_FACEBOOK; document.getElementById('linkInstagram').href = CONFIG_INSTAGRAM; document.getElementById('linkTwitter').href = CONFIG_TWITTER; document.getElementById('linkYoutube').href = CONFIG_YOUTUBE; document.getElementById('linkDirections').href = CONFIG_DIRECTIONS; document.getElementById('mapIframe').src = CONFIG_MAP_SRC;

/* CM016 - Input Validations (Names to Title Case, Mobile Numbers 10 Digits only) */
document.getElementById('inputName').addEventListener('input', function(e) { e.target.value = e.target.value.toLowerCase().replace(/(^\w{1})|(\s+\w{1})/g, letter => letter.toUpperCase()); }); document.getElementById('inputMobile').addEventListener('input', function(e) { e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 10); });

/* CM017 - Action Button Functions */
document.getElementById('btnShare').addEventListener('click', function() { alert('Share link copied!'); }); document.getElementById('btnSave').addEventListener('click', function() { alert('Location saved!'); });

/* CM018 - Form Submission Logic for Google Apps Script */
document.getElementById('contactForm').addEventListener('submit', function(e) { e.preventDefault(); const btn = document.getElementById('btnSubmit'); const ogText = btn.innerHTML; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...'; btn.disabled = true; fetch(CONFIG_SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ fullName: document.getElementById('inputName').value, emailAddress: document.getElementById('inputEmail').value, mobileNumber: document.getElementById('inputMobile').value, userMessage: document.getElementById('inputMessage').value }) }).then(() => { alert('Message sent successfully!'); document.getElementById('contactForm').reset(); btn.innerHTML = ogText; btn.disabled = false; }).catch(err => { alert('Error: ' + err); btn.innerHTML = ogText; btn.disabled = false; }); });
</script>
</body>
</html>
